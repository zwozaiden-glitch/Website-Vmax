<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ============================================================
    Protect-Vmax — Login page
    ============================================================
    Simple email + password login. The credentials live in the
    config block at the top of script.js (LOGIN_EMAIL /
    LOGIN_PASSWORD) — edit them there.

    NOTE: this is a static site, so the check runs in the browser.
    It's a simple gate for the dashboard preview, not real
    server-side security. For real security, validate credentials
    on your bot's API instead.
    ============================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Protect-Vmax</title>
  <meta name="description" content="Log in with your email and password to open the Protect-Vmax dashboard." />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>

  <!-- ============================= NAV ============================= -->
  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html" aria-label="Protect-Vmax home">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 4.6-3 8.2-7 10-4-1.8-7-5.4-7-10V6l7-3z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </span>
        <span class="brand-name">Protect-<span class="gradient-text">Vmax</span></span>
      </a>

      <nav class="nav-links" id="nav-links" aria-label="Primary">
        <a href="index.html#features">Features</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="index.html#api">API</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#faq">FAQ</a>
      </nav>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="login-main">
    <section class="login-section">
      <div class="login-card glass reveal is-visible" id="login-card">

        <div class="login-brand" aria-hidden="true">
          <span class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l7 3v5c0 4.6-3 8.2-7 10-4-1.8-7-5.4-7-10V6l7-3z" />
              <path d="M9 12l2 2 4-4" />
            </svg>
          </span>
        </div>

        <h1>Welcome back</h1>
        <p class="login-sub">Enter your email and password to open your dashboard.</p>

        <form class="login-form" id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input class="input" type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="username" required />
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="login-password" name="password" placeholder="Your password" autocomplete="current-password" required />
              <button class="pw-toggle" type="button" id="pw-toggle" aria-label="Show password" aria-pressed="false">
                <svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.9 9.9 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19" />
                  <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                  <path d="M2 2l20 20" />
                </svg>
              </button>
            </div>
          </div>

          <p class="login-error" id="login-error" role="alert" hidden></p>

          <button class="btn btn-primary btn-lg btn-block" type="submit" id="login-submit">Log in</button>
        </form>

        <div class="login-hint" id="login-hint">
          <span class="login-hint-title">Demo credentials</span>
          <span class="login-hint-creds"><code id="hint-email"></code>&nbsp;&middot;&nbsp;<code id="hint-password"></code></span>
          <span class="login-hint-note">Change them in <code>script.js</code> (LOGIN_EMAIL / LOGIN_PASSWORD).</span>
        </div>

        <p class="login-back"><a href="index.html">&larr; Back to home</a></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
